name: Check and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TMPDIR: ${{ github.workspace }}/target/build-tmp

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: mkdir -p "$TMPDIR"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        shell: bash
        run: |
          if cargo +stable test --locked 2>&1 | tee target/ci-test.log; then
            exit 0
          fi
          message=$(tail -80 target/ci-test.log)
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          printf '::error title=Rust tests failed::%s\n' "$message"
          exit 1
      - run: node --check web/app.js

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: mkdir -p "$TMPDIR"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - name: Build standalone Linux binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo +stable build --locked --release --target x86_64-unknown-linux-musl
      - name: Prepare release assets
        run: |
          test "$(target/x86_64-unknown-linux-musl/release/server --version)" = "server ${RELEASE_TAG#v}"
          mkdir -p dist
          for binary in server worker updater; do
            cp "target/x86_64-unknown-linux-musl/release/$binary" "dist/$binary-x86_64-unknown-linux-musl"
          done
          cd dist
          sha256sum *-x86_64-unknown-linux-musl > SHA256SUMS
      - name: Publish complete release
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
